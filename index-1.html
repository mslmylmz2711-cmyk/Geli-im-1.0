<style>

    background: linear-gradient(135deg, #1e293b, #334155);
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; color: #1e293b; }
  .sub { font-size: 0.8rem; color: #64748b; margin: 0 0 4px; }
  .credit { font-size: 0.65rem; color: #cbd5e1; margin: 0 0 20px; font-style: italic; }
  .buttons { display: flex; gap: 12px; margin-bottom: 24px; }
  button {
    flex: 1;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.96); }
  #btnA { background: #2563eb; }
  #btnB { background: #dc2626; }
  .result {
    min-height: 110px;
    border-radius: 14px;
    background: #f1f5f9;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .tag {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #64748b;
  }
  .word { font-size: 1.8rem; font-weight: 800; color: #0f172a; }
  .meaning { font-size: 1.05rem; color: #475569; font-weight: 500; min-height: 1.4em; }
  .placeholder { color: #94a3b8; font-size: 0.95rem; }
  .showBtn {
    margin-top: 4px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    background: #0f172a;
    border-radius: 8px;
  }
  .count { margin-top: 16px; font-size: 0.7rem; color: #94a3b8; }
  .reset {
    margin-top: 8px;
    background: none;
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 4px;
    text-decoration: underline;

</style>

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refillPool(list) {
    return shuffle(list);
  }

  function getNext(list, poolName) {
    if (poolName === "en") {
      if (englishPool.length === 0) englishPool = refillPool(list);
      return englishPool.pop();
    } else {
      if (germanPool.length === 0) germanPool = refillPool(list);
      return germanPool.pop();
    }
  }

  function updateCount() {
    countEl.textContent =
      `İngilizce tur: ${englishWords.length - englishPool.length}/${englishWords.length} · ` +
      `Almanca tur: ${germanWords.length - germanPool.length}/${germanWords.length}`;
  }

  function showWord(item, tag) {
    resultEl.innerHTML = `
      <span class="tag">${tag}</span>
      <span class="word">${item.word}</span>
      <span class="meaning" id="meaningText"></span>
      <button class="showBtn" id="showMeaningBtn">Türkçesini göster</button>
    `;
    document.getElementById("showMeaningBtn").addEventListener("click", () => {
      document.getElementById("meaningText").textContent = item.tr;
      document.getElementById("showMeaningBtn").style.display = "none";
    });
  }

  document.getElementById("btnA").addEventListener("click", () => {
    const item = getNext(englishWords, "en");
    showWord(item, "İngilizce (B1–B2)");
    updateCount();
  });

  document.getElementById("btnB").addEventListener("click", () => {
    const item = getNext(germanWords, "de");
    showWord(item, "Almanca (A1)");
    updateCount();
  });

  resetBtn.addEventListener("click", () => {
    englishPool = [];
    germanPool = [];
    resultEl.innerHTML = '<span class="placeholder">Bir kelime görmek için A veya B\'ye tıkla</span>';
    updateCount();
  });

  updateCount();
</script>
</body>
</html>
